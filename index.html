<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DN Size Availability Carousel</title>
  <!-- Bootstrap 5 CSS -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    /* Ensures the carousel stays centered and contained */
    .carousel-container {
      max-width: 500px;
      margin: 300px auto;
    }
    /* Fixed height for image area to keep text aligned */
    .carousel-img-wrapper {
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
    }
    .carousel-img-wrapper img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
    /* Custom styling to keep the text clearly visible below the image */
    .carousel-caption-below {
      padding: 15px;
      text-align: center;
      background: #ffffff;
      color: #333333;
    }
  </style>
</head>
<body>

<div class="container mt-3">
  <!-- Use text-center utility and remove default bottom margins (mb-0) -->
  <h1 class="text-center mb-0">DN Size Availability</h1>
  
  <!-- Changed margin from 'margin: 30px auto' to 'margin: 10px auto' -->
  <div class="carousel-container shadow rounded overflow-hidden mt-2">
    
    <!-- Bootstrap Carousel (touch swiping enabled by default in BS5) -->
    <div id="dnCarousel" class="carousel slide" data-bs-ride="false">
      
      <div class="carousel-inner">
        
        <!-- Item 1: DN 1 -->
        <div class="carousel-item active">
          <div class="carousel-img-wrapper">
            <!-- Replace with your actual image path -->
            <img src="images/1.jpeg" class="d-block" alt="DN 1">
          </div>
          <div class="carousel-caption-below border-top">
            <h5 class="fw-bold">DN 1</h5>
            <p class="mb-1 text-muted"><strong>Available Colors & Sizes:</strong></p>
            <span class="badge bg-warning text-dark me-1">Orange: 42/48</span>
            <span class="badge bg-warning text-dark me-1">Yellow: 38/54</span>
            <span class="badge bg-warning text-dark">Peach: 42/46</span>
          </div>
        </div>

        <!-- Item 2: DN 2 -->
        <div class="carousel-item active">
          <div class="carousel-img-wrapper">
            <!-- Replace with your actual image path -->
            <img src="images/2.jpeg" class="d-block" alt="DN 1">
          </div>
          <div class="carousel-caption-below border-top">
            <h5 class="fw-bold">DN 1</h5>
            <p class="mb-1 text-muted"><strong>Available Colors & Sizes:</strong></p>
            <span class="badge bg-warning text-dark me-1">Orange: 42/48</span>
            <span class="badge bg-warning text-dark me-1">Yellow: 38/54</span>
            <span class="badge bg-warning text-dark">Peach: 42/46</span>
          </div>
        </div>

      </div>

      <!-- Left and Right Controls (Visible arrows) -->
      <button class="carousel-control-prev" type="button" data-bs-target="#dnCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-dark rounded-circle" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#dnCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-dark rounded-circle" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
      
    </div>
    
  </div>
</div>

<!-- Bootstrap 5 JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
